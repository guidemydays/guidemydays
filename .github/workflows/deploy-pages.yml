name: Deploy site (publish only — validation is local)

# The deploy just PUBLISHES. It does not validate, re-validate, quarantine, or
# hold anything back.
#
# Validation is purely LOCAL: a crib runs Brain/scripts/validate_itinerary.py,
# and only on a clean pass does it earn a content-bound SIGNED stamp
# (Brain/scripts/validation_stamp.py). A guide that fails stays untracked on the
# Drive and never reaches the repo — the local pre-push hook (pre_push_guard.py)
# blocks any push that adds/modifies a guide lacking a valid signed stamp.
#
# So the repo only ever contains guides that passed locally. There is nothing
# per-GUIDE to check at deploy time — this workflow stages Travel-Website/ and
# publishes it. No placeholders, no all-or-nothing block, no CI format validation.
#
# ONE EXCEPTION, and it is not a format opinion: SHIPPED JS MUST PARSE.
# (owner, 2026-08-23, after the homepage went dead: "we need to fix it in a way
# that never happens again. we cant have this happening spcially in the
# homepage".) Every page on this site loads assets/toolbar.js, and a browser
# discards an unparseable script SILENTLY — so one stray character takes the
# whole site down with no error anywhere, and the person checking usually has a
# cached copy that still works. It has happened twice: 723e833a (2026-08-08, a
# star-slash inside an sw.js changelog comment closed it early) and 2050e65b5
# (2026-08-23, toolbar.js AIRPORTS carried {iata:'KIX','KOA', ...} — a bare
# string in an object literal).
#
# The local gates (pre_commit_guard._js_parse_error, pre_push_guard) both depend
# on core.hooksPath being wired in this clone, so --no-verify, a fresh clone, or
# any commit made outside them walks straight past. This step does not: it runs
# on GitHub, on the pushed commit, and it CANNOT be bypassed locally. It gates
# the BUILD, so a failure means the deploy never runs and THE LAST GOOD SITE
# STAYS LIVE — a broken commit stops at CI instead of reaching readers.
#
# It is deliberately the narrowest possible check: "does this file parse", not
# "is this file good". There is no such thing as a deliberate SyntaxError, so it
# has no override.
#
# Serving: the CONTENTS of Travel-Website/ are staged at the artifact root +
# .nojekyll, so the site is served at https://guidemydays.com/… — a page at
# Travel-Website/Guides/X/y.html is live at https://guidemydays.com/Guides/X/y.html.
# The custom domain comes from Travel-Website/CNAME, which lands at the artifact
# root alongside the pages. (.github/ and .git are NOT published.)
#
# 2026-08-10: cut over from the-voyager-expert.github.io/Travel/Travel-Website/ to
# the guidemydays.com apex, dropping the /Travel-Website/ path segment. Staging
# changed from `cp -r Travel-Website _site/…` to `cp -r Travel-Website/. _site/`.
# Safe because the site carries ZERO root-absolute links — every href/src is
# relative, and toolbar.js derives its base from each page's data-depth, which is
# measured to the site root and so is unchanged by the flatten.
#
# Rollback: set Pages build type back to "legacy" (Settings → Pages → Source →
# Deploy from a branch).

on:
  push:
    branches: [main]
  # A site can go down with no commit behind it — an expired cert, a DNS change,
  # a Pages incident, or a service worker serving a stale bad copy. The
  # deploy-triggered smoke below never sees those, so the smoke job also runs on
  # its own every 6 hours. On a schedule run, build/deploy are SKIPPED and only
  # the smoke job runs: this checks the site, it never republishes it.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shipped JS must parse (blocks the deploy — see header)
        run: |
          set -uo pipefail
          fail=0
          for f in Travel-Website/assets/*.js Travel-Website/sw.js; do
            [ -e "$f" ] || continue
            if ! err=$(node --check "$f" 2>&1); then
              fail=1
              echo "::error file=$f::$f does not parse — $(echo "$err" | grep -m1 -E 'SyntaxError|Error' || echo 'node --check failed')"
              echo "$err" | head -12
            fi
          done
          # toolbar.js is loaded by EVERY page, so its absence is a site-wide outage.
          if [ ! -s Travel-Website/assets/toolbar.js ]; then
            fail=1
            echo "::error::Travel-Website/assets/toolbar.js is missing or empty — every page on the site depends on it."
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "DEPLOY BLOCKED — refusing to publish unparseable JS."
            echo "The previously deployed site stays live and is unaffected."
            echo "Fix the file, commit, and push again. Reproduce locally with:"
            echo "    node --check Travel-Website/assets/toolbar.js"
            exit 1
          fi
          echo "All shipped JS parses."

      - name: Stage site (publish as-is — validation is enforced locally)
        run: |
          mkdir -p _site
          cp -r Travel-Website/. _site/
          if [ -f .nojekyll ]; then cp .nojekyll _site/.nojekyll; else touch _site/.nojekyll; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ───────────────────────────────────────────────────────────────────────────
  # POST-DEPLOY HEALTH CHECK — the only layer that runs AFTER the bytes are live.
  #
  # It cannot prevent a bad deploy; the parse gate in `build` does that. This
  # DETECTS, and the detection is the point: the parse gates all ask "does this
  # file parse", and a runtime error parses perfectly. This kills the page and
  # is invisible to every gate before it:
  #
  #     TVE.home.init(window.__CFG.toolbar)     // __CFG is undefined
  #
  # `node --check` is green on that line. So a real browser loads the real
  # domain and asserts the site actually came up: HTTP 200, zero uncaught JS
  # errors, window.TVE defined (toolbar.js RAN, not merely downloaded), and the
  # toolbar rendered nodes into the DOM.
  #
  # A failure turns the run red, which is the alarm — GitHub emails the owner.
  # It runs TWICE before believing it, because an alarm that cries wolf gets
  # ignored, and an ignored alarm is worse than no alarm at all.
  # ───────────────────────────────────────────────────────────────────────────
  smoke:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (chromium only)
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Live smoke — does the site actually boot for a reader?
        run: |
          set -uo pipefail
          # --expect-sha waits for the edge to serve THIS commit before asserting;
          # on a schedule run there is no new commit to wait for.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS=""
          else
            ARGS="--expect-sha ${{ github.sha }}"
          fi

          if python3 .github/scripts/live_smoke.py $ARGS; then
            exit 0
          fi

          echo ""
          echo "First pass failed — waiting 60s and retrying once before alarming."
          echo "(CDN propagation and transient edge faults look identical to an"
          echo " outage on a single pass; a real outage fails both.)"
          sleep 60

          if python3 .github/scripts/live_smoke.py $ARGS; then
            echo "Second pass passed — first was transient. Not alarming."
            exit 0
          fi

          echo ""
          echo "🚨 CONFIRMED: the live site failed the health check TWICE."
          echo "   This is what a reader is getting right now."
          exit 1
