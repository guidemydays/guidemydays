<title>Ask Your Guide</title>
<style>
/* GENERATED by Brain/scripts/build/build_ask_your_guide.py — do not hand-edit.
   A wrong number is fixed on its /stats/{region}/ page, then re-extracted and
   rebuilt; an edit here is reverted by the next run without a word. */

/* .wrap carries the rail (--rail/--gutter, shared CSS). Never re-cap it
   here with a literal — Thirty-second non-negotiable. */
.ag-field { display: flex; justify-content: center; }

/* Hidden on arrival. There is no default place and no empty card standing in for
   one — same rule as /plugs/ and /currencies/ (Fiftieth + Fifty-third
   non-negotiables). The ONLY thing that may arrive with a place chosen is a
   #City link clicked in a guide. */
#ag-result { margin-top: var(--search-gap, 32px); }
/* .ag-pack sets a display, and a class rule beats the UA sheet's [hidden] —
   without this the attribute is set and nothing moves. */
#ag-result[hidden] { display: none !important; }

.ag-pack { display: block; }
.ag-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 18px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 2px solid var(--text);
}
/* ONE TYPEFACE PER JOB, ONE INK PER MEANING. The head carried Georgia for the
   title, bold Public Sans for a filled pill that REPEATED it, and three chips on
   three different coloured grounds — "several fonts and colors" (owner rule
   2026-08-23). Now the name IS the link: Georgia for it and for the figures,
   Public Sans for everything that labels them. */
.ag-place {
  display: inline-flex; align-items: baseline; gap: 10px;
  font-family: Georgia, Cambria, serif; font-size: 31px; font-weight: 700;
  margin: 0; letter-spacing: -.02em; line-height: 1.1;
  color: var(--text); text-decoration: none;
}
.ag-place::after {
  content: "→"; font-family: var(--font); font-size: 15px; font-weight: 700;
  color: var(--rust); transition: transform .15s;
}
.ag-place:visited { color: var(--text); }
.ag-place:hover { color: var(--rust); }
.ag-place:hover::after { transform: translateX(4px); }
.ag-of { display: block; font-family: var(--font); font-size: 12px; font-weight: 400;
  color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-top: 6px; }

.ag-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.ag-fact {
  display: inline-flex; align-items: baseline; gap: 7px;
  font-size: 12.5px; padding: 6px 12px; border-radius: var(--fam-radius, 4px);
  border: 1px solid var(--border2); background: var(--surface); color: var(--muted);
}
.ag-fact b { font-weight: 700; color: var(--text); }
.ag-fact span { color: var(--muted); }
/* Safety is the ONE chip that earns a colour, because it is a LEVEL and the
   level is the point. Trip cost and currency are plain facts and take the
   neutral box — three coloured grounds side by side was the complaint. */
.ag-fact.is-good b { color: var(--fam-green-ink); }
.ag-fact.is-mid  b { color: var(--fam-yellow-ink); }
.ag-fact.is-warn b { color: var(--fam-orange-ink); }

/* Cards own their own rule and sit on the page. The connected-grid trick (a
   border2 backdrop showing through 1px gaps) painted every UNFILLED cell of the
   last row as a solid beige block — auto-fill always leaves some, so nearly
   every section ended in a phantom card. */
.ag-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
  gap: 8px;
}
.ag-stat {
  display: block; padding: 14px 15px 12px; background: var(--surface);
  border: 1px solid var(--border2); border-radius: 8px;
  transition: border-color .15s;
}
.ag-stat:hover { border-color: rgba(192,78,26,.35); }

.ag-val {
  display: block; font-family: Georgia, Cambria, serif; font-size: 25px;
  font-weight: 700; line-height: 1.05; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.ag-label { display: block; font-size: 13px; color: var(--text); font-weight: 500;
  line-height: 1.3; margin-top: 8px; }
/* The unit and the caveat, demoted out of the label so the label stays one line. */
.ag-note { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.ag-period { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* THE RANK, DRAWN. "12th of 30" is a position in a field, and a position is
   easier to see than to read — so it keeps the words AND gets a track showing
   where it sits. Nothing is interpreted: no better/worse, no colour coding by
   direction, because "1st in poverty" is not good news and the page does not
   pretend to know which way is up (owner: "i dont want us to digest the data"). */
.ag-rank { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.ag-rank-track {
  position: relative; flex: 1; min-width: 0; height: 3px;
  border-radius: 99px; background: var(--border2);
}
.ag-rank-dot {
  position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%;
  background: var(--rust); transform: translate(-50%, -50%);
}
.ag-rank-txt {
  font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  white-space: nowrap; flex: 0 0 auto;
}
.ag-rank-txt b { color: var(--rust); font-weight: 700; }

.ag-sun { display: flex; align-items: flex-end; gap: 4px; height: 78px; margin-top: 6px; }
.ag-sun-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.ag-sun-bar { width: 100%; background: #c8a44a; border-radius: 2px 2px 0 0; min-height: 2px; }
.ag-sun-mo { font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
.ag-sun-total { font-size: 12px; color: var(--muted); margin-top: 9px; }
.ag-sun-total b { color: var(--text); font-variant-numeric: tabular-nums; }

.ag-guide-row { margin-top: 20px; }
.ag-sources { margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--border);
  font-size: 11.5px; color: var(--muted); line-height: 1.6; }

@media (max-width: 700px) {
  .ag-place { font-size: 24px; }
  .ag-grid { grid-template-columns: 1fr; }
  .ag-sun-mo { font-size: 8px; }
}
</style>

<!-- Incoming #City deep-link guard — strip the fragment BEFORE the page settles
     so iOS Safari never performs a native on-load fragment jump. That jump drops
     the compositor layer of the fixed "&larr; Back to {City}" pill
     (toolbar.js #tve-back-to-guide), leaving the reader with no visible route
     back to the guide on mobile. The place is re-selected from window.__tveDeep
     at the bottom of the page instead. Required by
     brain_check.check_no_location_hash_in_jump_pages. Do NOT remove. -->
<script>(function(){try{var h=location.hash;if(h&&h.length>1){window.__tveDeep=decodeURIComponent(h.slice(1));history.replaceState(null,'',location.pathname+location.search);}}catch(e){}}());</script>

             and colors"). One element now: the city's name, which is both the
             heading and the way into its guide. -->
        <a class="ag-place" id="ag-guide-link" href="/guides/"></a>

      <div class="ag-facts" id="ag-facts"></div>
      <!-- CITY-LEVEL cost, from /essentials/budget/ — the country tables do not

      <div class="ag-group" id="ag-cost-group" hidden>

      <div id="ag-groups"></div>

            '<span class="ag-val">'+esc(bd[3][i][1])+'</span>'+
            '<span class="ag-label">'+esc(bd[3][i][0])+'</span>'+
            '<span class="ag-note">index</span></div>';
      }
      document.getElementById('ag-cost').innerHTML=ch;
      document.getElementById('ag-cost-head').textContent=
        'What things cost here · '+(SCOPE_WORD[bd[2]]||bd[2]);
      cg.hidden=false;
    } else { cg.hidden=true; }

    var gl=document.getElementById('ag-guide-link');
    gl.href='/guides/'+slug+'.html';
    gl.textContent=city;

    /* A stats-page source string often carries a per-column caveat about some
       OTHER country ("… 2024 (score out of 10) · Monaco not included in WHR").
       On a Vienna pack that is noise about Monaco, so only the source itself —
       everything before the first separator — is kept. */
    var srcs={}, list=[];
    for(k in place.m){
      if(!place.m.hasOwnProperty(k)||!cols[k]||!cols[k].s) continue;
      var src=String(cols[k].s).split(' \u00b7 ')[0].trim();
      if(src&&!srcs[src]){ srcs[src]=1; list.push(src); }
    }
    document.getElementById('ag-sources').textContent=list.length?('Sources: '+list.join(' \u00b7 ')):'';

    elRes.hidden=false;
  }

  function statRow(key, m, col){
    /* A READER'S LABEL, and the unit demoted to its own small line. The stats
       pages name columns for a ranking table — "Tertiary Education Attainment
       (% adults 25-64)" — which beside a 25px figure wraps to three lines and
       buries the fact. Nothing is reworded away: the caveat moves to the note,
       where it is still exact. A key with no short form keeps its column name. */
    var sh=AGSHORT[key], of=col?col.o:null, rank=m[1];
    var label=sh?sh[0]:(col?col.l:key);
    var note=sh?sh[1]:'';
    if(!note&&col&&col.p&&!/year|month|annual/i.test(label)) note=col.p;
    var rankHtml='';
    if(rank&&of){
      /* Position in the field, 0% = 1st. Never coloured by direction: "1st in
         poverty" is not good news and the page does not decide which way is up. */
      var pct=(of>1)?((rank-1)/(of-1)*100):0;
      rankHtml='<span class="ag-rank">'+
        '<span class="ag-rank-track"><span class="ag-rank-dot" style="left:'+pct+'%"></span></span>'+
        '<span class="ag-rank-txt"><b>'+ord(rank)+'</b> of '+of+'</span></span>';
    }
    return '<div class="ag-stat">'+
      '<span class="ag-val">'+esc(m[0])+'</span>'+
      '<span class="ag-label">'+esc(label)+'</span>'+
      (note?'<span class="ag-note">'+esc(note)+'</span>':'')+
      rankHtml+
    '</div>';
  }

  if(window.TVESearch){
    var items=[];
    for(i=0;i<AGG.length;i++){
      var r=AGG[i];
      /* sub carries the COUNTRY, so the shared typeahead — which matches on name
         OR sub — answers "Spain" with every Spanish guide, not just the one the
         stats page happened to link. */
      items.push({name:r[1], sub:r[2], anchor:r[0]});
    }
    TVESearch.attach(input,{items:items,onPick:function(it){ show(it.anchor); }});
  }

  /* The ONE thing that may arrive with a place already chosen: a #City link the
     reader clicked in a guide. */
  if(window.__tveDeep && BYA[window.__tveDeep]){
    input.value=BYA[window.__tveDeep][1];
    show(window.__tveDeep);
  }
}());
</script>
</body>
