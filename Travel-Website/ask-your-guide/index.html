<style>
/* GENERATED by Brain/scripts/build/build_ask_your_guide.py — do not hand-edit.
   A wrong number is fixed on its /stats/{region}/ page, then re-extracted and
   rebuilt; an edit here is reverted by the next run without a word. */

/* .wrap carries the rail (--rail/--gutter, shared CSS). Never re-cap it
   here with a literal — Thirty-second non-negotiable. */
.ag-field { display: flex; justify-content: center; }

/* Hidden on arrival. There is no default place and no empty card standing in for
   one — same rule as /plugs/ and /currencies/ (Fiftieth + Fifty-third
   non-negotiables). The ONLY thing that may arrive with a place chosen is a
   #City link clicked in a guide. */
#ag-result { margin-top: var(--search-gap, 32px); }
/* .ag-pack sets a display, and a class rule beats the UA sheet's [hidden] —
   without this the attribute is set and nothing moves. */
#ag-result[hidden] { display: none !important; }

.ag-pack { display: block; }
.ag-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 18px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 2px solid var(--text);
}
.ag-head-l { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.ag-place { font-family: Georgia, Cambria, serif; font-size: 30px; font-weight: 700;
  margin: 0; letter-spacing: -.02em; line-height: 1.1; }
/* Beside the title, not a pill at the foot of the page (owner rule 2026-08-23:
   "open the guide should not be a pill on the botton. make the title to be or
   something close to the tittle"). */
.ag-open { font-size: 13px; font-weight: 600; color: var(--rust); text-decoration: none;
  white-space: nowrap; }
.ag-open::after { content: " →"; }
.ag-open:hover { text-decoration: underline; }

.ag-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ag-fact { display: inline-flex; align-items: baseline; gap: 6px;
  font-size: 12.5px; padding: 5px 11px; border-radius: var(--fam-radius, 4px);
  border: 1px solid var(--fam-grey-bd); background: var(--fam-grey-bg); color: var(--text); }
.ag-fact b { font-weight: 700; }
.ag-fact span { color: var(--muted); }
.ag-fact.is-good { border-color: var(--fam-green-bd); background: var(--fam-green-bg); }
.ag-fact.is-good b { color: var(--fam-green-ink); }
.ag-fact.is-mid { border-color: var(--fam-yellow-bd); background: var(--fam-yellow-bg); }
.ag-fact.is-mid b { color: var(--fam-yellow-ink); }
.ag-fact.is-warn { border-color: var(--fam-orange-bd); background: var(--fam-orange-bg); }
.ag-fact.is-warn b { color: var(--fam-orange-ink); }
.ag-of { display: block; font-family: var(--font); font-size: 12px; font-weight: 400;
  color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 5px; }
.ag-scope { font-size: 12px; color: var(--muted); max-width: 40ch; }

.ag-group { margin-top: 26px; }
.ag-group > h2 {
  font-size: var(--fs-label, 11px); font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted);
  margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--border2);
}
.ag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 0 22px; }
.ag-stat { display: flex; align-items: baseline; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--border2); }
.ag-label { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); line-height: 1.35; }
.ag-val { font-family: Georgia, Cambria, serif; font-size: 16.5px; font-weight: 700;
  font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
.ag-rank { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  white-space: nowrap; flex: 0 0 auto; }
.ag-rank b { color: var(--rust); font-weight: 700; }
.ag-period { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.ag-sun { display: flex; align-items: flex-end; gap: 4px; height: 78px; margin-top: 6px; }
.ag-sun-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.ag-sun-bar { width: 100%; background: #c8a44a; border-radius: 2px 2px 0 0; min-height: 2px; }
.ag-sun-mo { font-size: 9.5px; color: var(--muted); text-transform: uppercase; }
.ag-sun-total { font-size: 12px; color: var(--muted); margin-top: 9px; }
.ag-sun-total b { color: var(--text); font-variant-numeric: tabular-nums; }

.ag-elsewhere { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
.ag-guide-row { margin-top: 20px; }
.ag-sources { margin-top: 26px; padding-top: 14px; border-top: 1px dashed var(--border);
  font-size: 11.5px; color: var(--muted); line-height: 1.6; }

@media (max-width: 700px) {
  .ag-place { font-size: 24px; }
  .ag-grid { grid-template-columns: 1fr; }
  .ag-sun-mo { font-size: 8px; }
}
</style>

     so iOS Safari never performs a native on-load fragment jump. That jump drops
     the compositor layer of the fixed "&larr; Back to {City}" pill
     (toolbar.js #tve-back-to-guide), leaving the reader with no visible route
     back to the guide on mobile. The place is re-selected from window.__tveDeep
     at the bottom of the page instead. Required by
     brain_check.check_no_location_hash_in_jump_pages. Do NOT remove. -->
<script>(function(){try{var h=location.hash;if(h&&h.length>1){window.__tveDeep=decodeURIComponent(h.slice(1));history.replaceState(null,'',location.pathname+location.search);}}catch(e){}}());</script>

"/time-zones/#Yellowstone","clock-stop","hours"],["Sunrise &amp; Sunset","/sunrise-sunset/","sunset","sunset"],["Plug Adapter","/plugs/#USA","plug","plug"],["Currency","/currencies/#United_States","money","money"],["Cost of Living","/essentials/budget/#yellowstone","budget","budget"],["Safety Guide","/essentials/safety/#Yellowstone","safety-guide","safety"],["Visas","/essentials/visa/","visas","visas"]],["Safe","","Moderate","USD (dollar)"]],["Zakynthos","Zakynthos","Greece","zakynthos",[["Weather","/weather/#Zakynthos","partly-cloudy","weather"],["Time Zones","/time-zones/#zakynthos","clock-stop","hours"],["Sunrise &amp; Sunset","/sunrise-sunset/","sunset","sunset"],["Plug Adapter","/plugs/#Greece","plug","plug"],["Currency","/currencies/#Greece","money","money"],["Cost of Living","/essentials/budget/#zakynthos","budget","budget"],["Safety Guide","/essentials/safety/#zakynthos","safety-guide","safety"],["Visas","/essentials/visa/","visas","visas"]],["Very Safe","","Moderate","EUR (euro)"]],["Zhangjiajie","Zhangjiajie","China","zhangjiajie",[["Weather","/weather/#Zhangjiajie","partly-cloudy","weather"],["Time Zones","/time-zones/#Zhangjiajie","clock-stop","hours"],["Sunrise &amp; Sunset","/sunrise-sunset/","sunset","sunset"],["Plug Adapter","/plugs/#China","plug","plug"],["Currency","/currencies/#China","money","money"],["Cost of Living","/essentials/budget/#zhangjiajie","budget","budget"],["Safety Guide","/essentials/safety/#Zhangjiajie","safety-guide","safety"],["Visas","/essentials/visa/","visas","visas"]],["Safe","","Budget","CNY (yuan)"]],["Zurich","Zurich","Switzerland","zurich",[["Weather","/weather/#Zurich","partly-cloudy","weather"],["Time Zones","/time-zones/#Zurich","clock-stop","hours"],["Sunrise &amp; Sunset","/sunrise-sunset/","sunset","sunset"],["Plug Adapter","/plugs/#Switzerland","plug","plug"],["Currency","/currencies/#Switzerland","money","money"],["Cost of Living","/essentials/budget/#zurich","budget","budget"],["Safety Guide","/essentials/safety/#Zurich","safety-guide","safety"],["Visas","/essentials/visa/","visas","visas"]],["Very Safe","","Premium","CHF (franc)"]],["Ålesund","Ålesund","Norway","alesund",[["Weather","/weather/#Alesund","partly-cloudy","weather"],["Time Zones","/time-zones/#Alesund","clock-stop","hours"],["Sunrise &amp; Sunset","/sunrise-sunset/","sunset","sunset"],["Plug Adapter","/plugs/#Norway","plug","plug"],["Currency","/currencies/#Norway","money","money"],["Cost of Living","/essentials/budget/#alesund","budget","budget"],["Safety Guide","/essentials/safety/#Alesund","safety-guide","safety"],["Visas","/essentials/visa/","visas","visas"]],["Very Safe","","Premium","NOK (krone)"]]];
var AGGROUPS=[["What people earn, what it costs", ["median_pay", "gdp", "cost", "poverty", "homeown", "home_price", "home", "rent", "minimum_wage", "tax_burden", "unemp", "unemployment"]], ["Who lives here", ["population", "medage", "university", "internet", "literacy", "schooling", "immig", "hs_graduation", "low_literacy", "school_quality", "founded"]], ["How long, and how well, people live", ["life", "happiness", "hdi", "alcohol", "obesity", "uninsured"]], ["Time off, and how much trust there is", ["vacation", "corruption", "renewables"]], ["Getting around, and how safe it is", ["walk", "commute", "crime", "vcrime", "violent_crime", "traffic_deaths"]], ["How many people come", ["visitors", "cruise", "unesco", "area", "coastline", "elevation", "hightemp", "seatemp", "rainfall"]]];
var AGSTATS={"europe": "Stats Across Europe", "asia": "Stats Across Asia", "africa": "Stats Across Africa", "oceania": "Stats Across Oceania", "south-america": "Stats Across South America", "caribbean": "Stats Across the Caribbean", "canada": "Stats Across Canada", "us": "Stats Across US"};
var AGMO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
</script>
<script>
(function(){
  var input=document.getElementById('ag-search');
  var elRes=document.getElementById('ag-result');
  if(!input||!elRes) return;

  var BYA={}, i;
  for(i=0;i<AGG.length;i++) BYA[AGG[i][0]]=AGG[i];

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function ord(n){ var s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

  function show(anchor){
    var row=BYA[anchor];
    if(!row){ elRes.hidden=true; return; }
    var city=row[1], placeName=row[2], slug=row[3];
    var place=AGP[placeName];
    if(!place){ elRes.hidden=true; return; }
    var cols=AGC[place.r]||{};

    /* Never print the name twice. On a city-level record the place IS the city,
       so this rendered "San Jose / SAN JOSE"; the sub-line names what the city
       sits inside instead. */
    var COUNTRY_OF={us:'United States',canada:'Canada'};
    var sub=(placeName===city)?(COUNTRY_OF[place.r]||''):placeName;
    document.getElementById('ag-place').innerHTML=
      esc(city)+(sub?'<span class="ag-of">'+esc(sub)+'</span>':'');
    /* Say what the number actually MEASURES. Compared by name this got New York
       City — whose place record is a city — described as a country, because the
       guide prints "New York" and the record is spelled "New York City". The
       subject is the fact; the spelling is not. */
    document.getElementById('ag-scope').textContent =
      (place.s==='country')
        ? 'These are national figures for '+placeName+'. A city can sit above or below its country.'
        : (place.s==='state')
          ? 'These are state-level figures for '+placeName+'.'
          : 'Measured for the city itself.';

    /* Group the metrics under the plain-spoken headings. A key that matches no
       group still ships, in the last one — a new column on a stats page must
       never disappear here just because this list has not caught up. */
    var used={}, out='', gi, k, j;
    for(gi=0;gi<AGGROUPS.length;gi++){
      var head=AGGROUPS[gi][0], keys=AGGROUPS[gi][1], rows='';
      for(j=0;j<keys.length;j++){
        k=keys[j];
        if(!place.m[k]||used[k]) continue;
        used[k]=1;
        rows+=statRow(k, place.m[k], cols[k]);
      }
      if(rows) out+='<div class="ag-group"><h2>'+esc(head)+'</h2><div class="ag-grid">'+rows+'</div></div>';
    }
    var restRows='';
    for(k in place.m){ if(place.m.hasOwnProperty(k)&&!used[k]) restRows+=statRow(k, place.m[k], cols[k]); }
    if(restRows) out+='<div class="ag-group"><h2>Also measured here</h2><div class="ag-grid">'+restRows+'</div></div>';
    document.getElementById('ag-groups').innerHTML=out;

    /* Sunshine is HOURS everywhere but the US, where it is sunny DAYS. The unit
       is printed rather than assumed — the two are not comparable. */
    var sunG=document.getElementById('ag-sun-group');
    if(place.sun){
      var s=place.sun, max=0, b='';
      for(i=0;i<s.mo.length;i++) if(s.mo[i]>max) max=s.mo[i];
      for(i=0;i<s.mo.length;i++){
        b+='<div class="ag-sun-col"><div class="ag-sun-bar" style="height:'+
           (max?(s.mo[i]/max*60):0)+'px" title="'+s.mo[i]+'"></div>'+
           '<span class="ag-sun-mo">'+AGMO[i]+'</span></div>';
      }
      document.getElementById('ag-sun-head').textContent=
        'Sunshine by month \u00b7 '+s.c+(s.u==='days'?' (sunny days)':' (hours)');
      document.getElementById('ag-sun').innerHTML=b;
      document.getElementById('ag-sun-total').innerHTML=
        '<b>'+s.a+'</b> '+(s.u==='days'?'sunny days':'hours')+' a year';
      sunG.hidden=false;
    } else { sunG.hidden=true; }

    /* The guide's OWN planning-page pills, inherited verbatim (see PILL_PAGES in
       the generator). Nothing here reconstructs a fragment: New York links
       /weather/#New York, /plugs/#USA and /currencies/#United_States, three
       spellings in one row, and every one of them is already correct. */
    var eh='', pills=row[4]||[];
    for(i=0;i<pills.length;i++){
      var e=pills[i];
      eh+='<a class="also-on-this-site-pill" href="'+esc(e[1])+'">'+
          '<svg class="gm-icon" data-icon="'+esc(e[2])+'" data-role="'+esc(e[3])+'" viewBox="0 0 24 24" '+
          'aria-hidden="true"><use href="#gm-i-'+esc(e[2])+'"/></svg> '+esc(e[0])+'</a>';
    }
    /* The rankings the guide's stats pill used to reach. Kept so retiring that
       pill moves the stats pages one hop further away rather than orphaning
       them: guide -> here -> the full table. */
    var stat=AGSTATS[place.r];
    if(stat){
      eh+='<a class="also-on-this-site-pill" href="/stats/'+place.r+'/">'+
          '<svg class="gm-icon" data-icon="chart" data-role="stats" viewBox="0 0 24 24" '+
          'aria-hidden="true"><use href="#gm-i-chart"/></svg> '+esc(stat)+'</a>';
    }
    document.getElementById('ag-elsewhere').innerHTML=eh;
    document.getElementById('ag-else-head').textContent='Everything else about '+city;

    /* City-level facts, repeated here on purpose (see the markup note). */
    var SAFE_CLASS={'Very Safe':'is-good','Safe':'is-good','Moderate':'is-mid',
                    'Caution':'is-warn','High Risk':'is-warn'};
    var TIER_CLASS={'Budget':'is-good','Moderate':'is-mid',
                    'Expensive':'is-warn','Premium':'is-warn'};
    var cf=row[5]||[], fh='';
    if(cf[0]) fh+='<span class="ag-fact '+(SAFE_CLASS[cf[0]]||'')+'">Safety <b>'+esc(cf[0])+'</b>'+
                  (cf[1]?'<span>'+esc(cf[1])+'</span>':'')+'</span>';
    if(cf[2]) fh+='<span class="ag-fact '+(TIER_CLASS[cf[2]]||'')+'">Trip cost <b>'+esc(cf[2])+'</b></span>';
    if(cf[3]) fh+='<span class="ag-fact">Currency <b>'+esc(cf[3])+'</b></span>';
    document.getElementById('ag-facts').innerHTML=fh;

    var gl=document.getElementById('ag-guide-link');
    gl.href='/guides/'+slug+'.html';
    gl.textContent='Open the '+city+' guide';

    /* A stats-page source string often carries a per-column caveat about some
       OTHER country ("… 2024 (score out of 10) · Monaco not included in WHR").
       On a Vienna pack that is noise about Monaco, so only the source itself —
       everything before the first separator — is kept. */
    var srcs={}, list=[];
    for(k in place.m){
      if(!place.m.hasOwnProperty(k)||!cols[k]||!cols[k].s) continue;
      var src=String(cols[k].s).split(' \u00b7 ')[0].trim();
      if(src&&!srcs[src]){ srcs[src]=1; list.push(src); }
    }
    document.getElementById('ag-sources').textContent=list.length?('Sources: '+list.join(' \u00b7 ')):'';

    elRes.hidden=false;
  }

  function statRow(key, m, col){
    var label=col?col.l:key, of=col?col.o:null, period=col&&col.p?col.p:'';
    /* The period tag exists because median pay is ANNUAL in Europe and MONTHLY
       in Asia and South America. Where the column's own label already says so —
       "Median Household Income (USD/year)" — the tag is just the same word
       twice, so it is dropped. */
    if(period&&/year|month|annual|\/yr|\/mo/i.test(label)) period='';
    return '<div class="ag-stat">'+
      '<span class="ag-label">'+esc(label)+(period?' <span class="ag-period">'+esc(period)+'</span>':'')+'</span>'+
      '<span class="ag-val">'+esc(m[0])+'</span>'+
      '<span class="ag-rank">'+(m[1]&&of?('<b>'+ord(m[1])+'</b>/'+of):'&mdash;')+'</span>'+
    '</div>';
  }

  if(window.TVESearch){
    var items=[];
    for(i=0;i<AGG.length;i++){
      var r=AGG[i];
      /* sub carries the COUNTRY, so the shared typeahead — which matches on name
         OR sub — answers "Spain" with every Spanish guide, not just the one the
         stats page happened to link. */
      items.push({name:r[1], sub:r[2], anchor:r[0]});
    }
    TVESearch.attach(input,{items:items,onPick:function(it){ show(it.anchor); }});
  }

  /* The ONE thing that may arrive with a place already chosen: a #City link the
     reader clicked in a guide. */
  if(window.__tveDeep && BYA[window.__tveDeep]){
    input.value=BYA[window.__tveDeep][1];
    show(window.__tveDeep);
  }
}());
</script>
