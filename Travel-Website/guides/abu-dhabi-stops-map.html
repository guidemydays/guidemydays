<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>abu-dhabi — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="abu-dhabi — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
  {
    "day": 1,
    "name": "Emirates Palace",
    "query": "Emirates Palace West Corniche Road Abu Dhabi",
    "lat": 24.4623864,
    "lng": 54.3174746
  },
  {
    "day": 1,
    "name": "Observation Deck at 300",
    "query": "Observation Deck at 300 Etihad Towers Tower 2 Abu Dhabi",
    "lat": 24.4583184,
    "lng": 54.3216619
  },
  {
    "day": 1,
    "name": "Qasr Al Watan",
    "query": "Qasr Al Watan Al Ras Al Akhdar Abu Dhabi",
    "lat": 24.4562667,
    "lng": 54.3115749
  },
  {
    "day": 2,
    "name": "Ferrari World Abu Dhabi",
    "query": "Ferrari World Yas Island Abu Dhabi",
    "lat": 24.484072,
    "lng": 54.6098893
  },
  {
    "day": 2,
    "name": "SeaWorld Abu Dhabi",
    "query": "SeaWorld Yas Island Abu Dhabi",
    "lat": 24.4858693,
    "lng": 54.6189872
  },
  {
    "day": 2,
    "name": "Yas Marina Circuit",
    "query": "Yas Marina Circuit Yas Island Abu Dhabi",
    "lat": 24.471847,
    "lng": 54.6058021
  },
  {
    "day": 2,
    "name": "Warner Bros. World Abu Dhabi",
    "query": "Warner Bros World Yas Island Abu Dhabi",
    "lat": 24.4919825,
    "lng": 54.600384
  },
  {
    "day": 3,
    "name": "Mangrove National Park",
    "query": "Eastern Mangroves Promenade Al Salam Street Abu Dhabi",
    "lat": 24.452877,
    "lng": 54.4089671
  },
  {
    "day": 3,
    "name": "Qasr Al Hosn",
    "query": "Qasr Al Hosn Sheikh Rashid Bin Saeed Al Maktoum Street Abu Dhabi",
    "lat": 24.4823376,
    "lng": 54.3552764
  },
  {
    "day": 3,
    "name": "Louvre Abu Dhabi",
    "query": "Louvre Abu Dhabi Saadiyat Cultural District Abu Dhabi",
    "lat": 24.5401926,
    "lng": 54.3993174
  },
  {
    "day": 3,
    "name": "Sheikh Zayed Grand Mosque",
    "query": "Sheikh Zayed Grand Mosque Abu Dhabi",
    "lat": 24.4124517,
    "lng": 54.474273
  },
  {
    "day": 4,
    "name": "Heritage Village",
    "query": "Heritage Village Breakwater Abu Dhabi",
    "lat": 24.3097621,
    "lng": 55.7457513
  },
  {
    "day": 4,
    "name": "Umm Al Emarat Park",
    "query": "Umm Al Emarat Park Al Mushrif Abu Dhabi",
    "lat": 24.4558,
    "lng": 54.3807
  },
  {
    "day": 4,
    "name": "Abu Dhabi Falcon Hospital",
    "query": "Abu Dhabi Falcon Hospital Sweihan Road Abu Dhabi",
    "lat": 24.4083189,
    "lng": 54.6987368
  },
  {
    "day": 4,
    "name": "Yas Waterworld",
    "query": "Yas Waterworld Yas Island Abu Dhabi",
    "lat": 24.4878629,
    "lng": 54.5994685
  },
  {
    "day": 5,
    "name": "CLYMB Abu Dhabi",
    "query": "CLYMB Abu Dhabi Yas Island",
    "lat": 24.486122,
    "lng": 54.6066361
  },
  {
    "day": 5,
    "name": "Yas Bay Waterfront",
    "query": "Yas Bay Waterfront Yas Island",
    "lat": 24.4589419,
    "lng": 54.6000145
  },
  {
    "day": 6,
    "name": "The Founder's Memorial",
    "query": "The Founder's Memorial Corniche Road Abu Dhabi",
    "lat": 24.4631279,
    "lng": 54.3223556
  },
  {
    "day": 6,
    "name": "Corniche Beach",
    "query": "Corniche Beach Abu Dhabi",
    "lat": 24.4741931,
    "lng": 54.3401872
  },
  {
    "day": 6,
    "name": "Jubail Mangrove Park",
    "query": "Jubail Mangrove Park Jubail Island Abu Dhabi",
    "lat": 24.5459872,
    "lng": 54.4867266
  }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
