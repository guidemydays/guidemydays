<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="amman — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
  {
    "day": 1,
    "name": "Roman Theatre",
    "query": "Roman Theatre, Al-Hashemi St, Amman, Jordan",
    "lat": 31.9516226,
    "lng": 35.9392889
  },
  {
    "day": 1,
    "name": "Amman Citadel",
    "query": "Amman Citadel, K. Ali Ben Al-Hussein St, Amman, Jordan",
    "lat": 31.9544825,
    "lng": 35.936707
  },
  {
    "day": 1,
    "name": "Rainbow Street",
    "query": "Rainbow Street, Jabal Amman, Amman, Jordan",
    "lat": 31.9492605,
    "lng": 35.9302941
  },
  {
    "day": 1,
    "name": "Jordan Museum",
    "query": "Jordan Museum, Ali bin Abi Taleb Street, Amman, Jordan",
    "lat": 31.9456069,
    "lng": 35.9271091
  },
  {
    "day": 2,
    "name": "King Abdullah I Mosque",
    "query": "King Abdullah I Mosque, Al Abdali, Amman, Jordan",
    "lat": 31.9611701,
    "lng": 35.9128694
  },
  {
    "day": 2,
    "name": "Royal Automobile Museum",
    "query": "Royal Automobile Museum, Al Hussein Public Parks, Amman, Jordan",
    "lat": 31.9831259,
    "lng": 35.8263387
  },
  {
    "day": 2,
    "name": "Abu Darwish Mosque",
    "query": "Abu Darwish Mosque, Jabal Ashrafieh, Amman, Jordan",
    "lat": 31.9414897,
    "lng": 35.9375716
  },
  {
    "day": 3,
    "name": "Petra",
    "query": "Petra Visitor Center, Wadi Musa, Jordan",
    "lat": 30.324297,
    "lng": 35.4678466
  },
  {
    "day": 4,
    "name": "Jerash",
    "query": "Archaeological Site of Jerash, Jerash, Jordan",
    "lat": 32.277027,
    "lng": 35.8975886
  },
  {
    "day": 4,
    "name": "Ajloun Castle",
    "query": "Ajloun Castle, Ajloun, Jordan",
    "lat": 32.3252401,
    "lng": 35.7273426
  },
  {
    "day": 5,
    "name": "Mount Nebo",
    "query": "Mount Nebo, Jordan",
    "lat": 31.7681678,
    "lng": 35.725269
  },
  {
    "day": 5,
    "name": "St. George's Church · Madaba",
    "query": "K. Talal St. 30, Madaba, Jordan",
    "lat": 31.7188342,
    "lng": 35.7933243
  },
  {
    "day": 5,
    "name": "Dead Sea",
    "query": "Amman Beach, Dead Sea, Jordan",
    "lat": 31.8999145,
    "lng": 35.8523194
  }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3hx8_1_38a66e98cc1ffebece53532c', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color), title: s.name, alt: s.name});
  marker.on('add', () => {
    const el = marker.getElement();
    if (el) el.setAttribute('aria-label', s.name + ', Day ' + s.day);
  });
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
