<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="Auckland — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Sky Tower",
        "query": "Sky Tower, Victoria St W, Auckland",
        "lat": -36.8480981,
        "lng": 174.7623821
    },
    {
        "day": 1,
        "name": "Auckland Art Gallery Toi o Tāmaki",
        "query": "Auckland Art Gallery, Kitchener St, Auckland",
        "lat": -36.851261,
        "lng": 174.7663713
    },
    {
        "day": 1,
        "name": "Auckland War Memorial Museum",
        "query": "Auckland War Memorial Museum, Auckland Domain, Parnell, Auckland",
        "lat": -36.8607564,
        "lng": 174.77781
    },
    {
        "day": 1,
        "name": "Auckland Domain Wintergardens",
        "query": "Auckland Domain Wintergardens, 20 Park Rd, Grafton, Auckland",
        "lat": -36.8608829,
        "lng": 174.7694825
    },
    {
        "day": 2,
        "name": "Voyager New Zealand Maritime Museum",
        "query": "Voyager New Zealand Maritime Museum, Cnr Quay & Hobson St, Auckland",
        "lat": -36.8415315,
        "lng": 174.7633964
    },
    {
        "day": 2,
        "name": "Takarunga / Mount Victoria",
        "query": "Takarunga Mount Victoria, Kerr St, Devonport, Auckland",
        "lat": -36.8264673,
        "lng": 174.7989258
    },
    {
        "day": 2,
        "name": "Maungauika / North Head",
        "query": "North Head Historic Reserve, Takarunga Rd, Devonport, Auckland",
        "lat": -36.8277095,
        "lng": 174.8123571
    },
    {
        "day": 2,
        "name": "Cheltenham Beach",
        "query": "Cheltenham Beach, Cheltenham Rd, Devonport, Auckland",
        "lat": -36.8222121,
        "lng": 174.8088693
    },
    {
        "day": 3,
        "name": "Maungawhau / Mount Eden",
        "query": "Maungawhau Mount Eden, Mount Eden Rd, Auckland",
        "lat": -36.8702586,
        "lng": 174.7671739
    },
    {
        "day": 3,
        "name": "Maungakiekie / One Tree Hill",
        "query": "Cornwall Park, 670 Manukau Rd, Auckland",
        "lat": -36.8880677,
        "lng": 174.7750263
    },
    {
        "day": 3,
        "name": "Kelly Tarlton's SEA LIFE Aquarium",
        "query": "Kelly Tarlton's, 23 Tamaki Dr, Orakei, Auckland",
        "lat": -36.8462033,
        "lng": 174.8171703
    },
    {
        "day": 3,
        "name": "Mission Bay",
        "query": "Mission Bay Beach, Tamaki Dr, Auckland",
        "lat": -36.848267,
        "lng": 174.831802
    },
    {
        "day": 4,
        "name": "Oneroa",
        "query": "Oneroa Village, Ocean View Rd, Waiheke Island",
        "lat": -36.7819161,
        "lng": 175.0098094
    },
    {
        "day": 4,
        "name": "Little Oneroa Beach",
        "query": "Little Oneroa Beach, Waiheke Island",
        "lat": -36.784216,
        "lng": 175.0178338
    },
    {
        "day": 4,
        "name": "Mudbrick Vineyard",
        "query": "Mudbrick Vineyard, 126 Church Bay Rd, Waiheke Island",
        "lat": -36.7924994,
        "lng": 175.0002321
    },
    {
        "day": 4,
        "name": "Cable Bay Vineyards",
        "query": "Cable Bay Vineyards, 12 Nick Johnstone Dr, Waiheke Island",
        "lat": -36.7876864,
        "lng": 175.0001919
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color), title: s.name, alt: s.name});
  marker.on('add', () => {
    const el = marker.getElement();
    if (el) el.setAttribute('aria-label', s.name + ', Day ' + s.day);
  });
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
