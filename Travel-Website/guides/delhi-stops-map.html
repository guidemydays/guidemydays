<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="delhi — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../../essentials/Maps/vendor/leaflet.min.js"></script>
<script src="../../essentials/Maps/vendor/markercluster.min.js"></script>
<script src="../../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Jama Masjid",
        "query": "Jama Masjid Delhi",
        "lat": 28.6506822,
        "lng": 77.232961
    },
    {
        "day": 1,
        "name": "Red Fort",
        "query": "Red Fort Delhi",
        "lat": 28.656081,
        "lng": 77.2407959
    },
    {
        "day": 1,
        "name": "Raj Ghat",
        "query": "Raj Ghat Delhi",
        "lat": 28.644154,
        "lng": 77.2498378
    },
    {
        "day": 2,
        "name": "Humayun's Tomb",
        "query": "Humayun's Tomb Delhi",
        "lat": 28.5932856,
        "lng": 77.2506468
    },
    {
        "day": 2,
        "name": "India Gate",
        "query": "India Gate New Delhi",
        "lat": 28.6129332,
        "lng": 77.2294928
    },
    {
        "day": 2,
        "name": "National Museum",
        "query": "National Museum New Delhi",
        "lat": 28.6119151,
        "lng": 77.2196391
    },
    {
        "day": 2,
        "name": "Jantar Mantar",
        "query": "Jantar Mantar New Delhi",
        "lat": 28.6271791,
        "lng": 77.2166166
    },
    {
        "day": 1,
        "name": "Agrasen ki Baoli",
        "query": "Agrasen ki Baoli New Delhi",
        "lat": 28.626024,
        "lng": 77.2250119
    },
    {
        "day": 3,
        "name": "Qutb Minar",
        "query": "Qutb Minar Delhi",
        "lat": 28.524413,
        "lng": 77.1854501
    },
    {
        "day": 3,
        "name": "Mehrauli Archaeological Park",
        "query": "Mehrauli Archaeological Park Delhi",
        "lat": 28.5212377,
        "lng": 77.1858618
    },
    {
        "day": 3,
        "name": "Hauz Khas",
        "query": "Hauz Khas Complex Delhi",
        "lat": 28.5533174,
        "lng": 77.1938654
    },
    {
        "day": 3,
        "name": "Lotus Temple",
        "query": "Lotus Temple Delhi",
        "lat": 28.5533586,
        "lng": 77.2586006
    },
    {
        "day": 4,
        "name": "Akshardham",
        "query": "Swaminarayan Akshardham Delhi",
        "lat": 28.6125167,
        "lng": 77.2773184
    },
    {
        "day": 4,
        "name": "Lodi Garden",
        "query": "Lodi Garden Delhi",
        "lat": 28.5945664,
        "lng": 77.2218564
    },
    {
        "day": 4,
        "name": "Gandhi Smriti",
        "query": "Gandhi Smriti New Delhi",
        "lat": 28.6018543,
        "lng": 77.2143898
    },
    {
        "day": 4,
        "name": "Bangla Sahib",
        "query": "Gurudwara Bangla Sahib Delhi",
        "lat": 28.6285156,
        "lng": 77.2095706
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
