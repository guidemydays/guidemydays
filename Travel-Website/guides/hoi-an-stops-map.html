<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>hoi-an — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="hoi-an — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
  {
    "day": 1,
    "name": "Fujian Assembly Hall",
    "query": "Fujian Assembly Hall 46 Tran Phu Hoi An",
    "lat": 15.8781389,
    "lng": 108.3309922
  },
  {
    "day": 1,
    "name": "Quan Cong Temple",
    "query": "Quan Cong Temple 24 Tran Phu Hoi An",
    "lat": 15.8775404,
    "lng": 108.3313895
  },
  {
    "day": 1,
    "name": "Cantonese Assembly Hall",
    "query": "Cantonese Assembly Hall 176 Tran Phu Hoi An",
    "lat": 15.8773153,
    "lng": 108.3265606
  },
  {
    "day": 1,
    "name": "Japanese Covered Bridge",
    "query": "Japanese Covered Bridge Tran Phu Hoi An",
    "lat": 15.8771541,
    "lng": 108.3260034
  },
  {
    "day": 1,
    "name": "Old House of Tan Ky",
    "query": "Old House of Tan Ky 101 Nguyen Thai Hoc Hoi An",
    "lat": 15.8759,
    "lng": 108.3277
  },
  {
    "day": 2,
    "name": "An Bang Beach",
    "query": "An Bang Beach Cam An Hoi An",
    "lat": 15.9116628,
    "lng": 108.3403158
  },
  {
    "day": 2,
    "name": "Cam Thanh Coconut Village",
    "query": "Cam Thanh Coconut Village Bay Mau Hoi An",
    "lat": 15.8756,
    "lng": 108.3667
  },
  {
    "day": 2,
    "name": "Tra Que Vegetable Village",
    "query": "Tra Que Vegetable Village Cam Ha Hoi An",
    "lat": 15.9021790,
    "lng": 108.3377346
  },
  {
    "day": 3,
    "name": "My Son Sanctuary",
    "query": "My Son Sanctuary Duy Phu Duy Xuyen Quang Nam",
    "lat": 15.7645,
    "lng": 108.1194
  },
  {
    "day": 4,
    "name": "Marble Mountains",
    "query": "Marble Mountains 81 Huyen Tran Cong Chua Da Nang",
    "lat": 16.0040200,
    "lng": 108.2627745
  },
  {
    "day": 4,
    "name": "Non Nuoc Stone Carving Village",
    "query": "Non Nuoc Stone Carving Village Da Nang",
    "lat": 16.0025,
    "lng": 108.2610
  },
  {
    "day": 4,
    "name": "Linh Ung Pagoda",
    "query": "Linh Ung Pagoda Son Tra Da Nang",
    "lat": 16.1003309,
    "lng": 108.2778579
  },
  {
    "day": 5,
    "name": "Ba Na Hills",
    "query": "Sun World Ba Na Hills Hoa Ninh Hoa Vang Da Nang",
    "lat": 15.9977,
    "lng": 107.9925
  },
  {
    "day": 6,
    "name": "Hue Imperial City",
    "query": "Ngo Mon Gate Hue Imperial City Le Huan Hue",
    "lat": 16.4669765,
    "lng": 107.5798488
  }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
