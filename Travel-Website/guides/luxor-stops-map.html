<body>

<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>

<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Karnak Temple Complex",
        "query": "Karnak Temple Road El-Karnak",
        "lat": 25.7184016,
        "lng": 32.6582453
    },
    {
        "day": 1,
        "name": "Avenue of Sphinxes",
        "query": "Avenue of Sphinxes Luxor",
        "lat": 25.7086195,
        "lng": 32.6488554
    },
    {
        "day": 1,
        "name": "Luxor Temple",
        "query": "Luxor Temple Corniche El Nil",
        "lat": 25.699525,
        "lng": 32.6390695
    },
    {
        "day": 1,
        "name": "Luxor Museum",
        "query": "Luxor Museum Corniche El Nil",
        "lat": 25.7076634,
        "lng": 32.644489
    },
    {
        "day": 2,
        "name": "Colossi of Memnon",
        "query": "Colossi of Memnon Kom el-Hittan",
        "lat": 25.7204945,
        "lng": 32.6104405
    },
    {
        "day": 2,
        "name": "Valley of the Kings",
        "query": "Valley of the Kings Biban el-Muluk",
        "lat": 25.7404899,
        "lng": 32.6017581
    },
    {
        "day": 2,
        "name": "Hatshepsut Temple",
        "query": "Hatshepsut Temple Deir el-Bahari",
        "lat": 25.7376127,
        "lng": 32.6073986
    },
    {
        "day": 3,
        "name": "Valley of the Queens",
        "query": "Valley of the Queens Biban el-Harim",
        "lat": 25.7277168,
        "lng": 32.5927578
    },
    {
        "day": 3,
        "name": "Deir el-Medina",
        "query": "Deir el-Medina West Bank Luxor",
        "lat": 25.7283777,
        "lng": 32.6010437
    },
    {
        "day": 3,
        "name": "Medinet Habu",
        "query": "Medinet Habu West Bank Luxor",
        "lat": 25.7199662,
        "lng": 32.6007346
    },
    {
        "day": 3,
        "name": "Ramesseum",
        "query": "Ramesseum West Bank Luxor",
        "lat": 25.7280523,
        "lng": 32.6100028
    },
    {
        "day": 4,
        "name": "Hot Air Balloon Ride",
        "query": "Dra Abu el-Naga West Bank Luxor",
        "lat": 25.7333,
        "lng": 32.6067
    },
    {
        "day": 4,
        "name": "Tombs of the Nobles",
        "query": "Tombs of the Nobles Sheikh Abd el-Qurna",
        "lat": 25.728,
        "lng": 32.6106
    },
    {
        "day": 4,
        "name": "Mummification Museum",
        "query": "Mummification Museum Corniche El Nil Luxor",
        "lat": 25.7025345,
        "lng": 32.6398801
    },
    {
        "day": 5,
        "name": "Unfinished Obelisk",
        "query": "Unfinished Obelisk Aswan",
        "lat": 24.0769125,
        "lng": 32.8954118
    },
    {
        "day": 5,
        "name": "Aswan High Dam",
        "query": "Aswan High Dam",
        "lat": 23.9704099,
        "lng": 32.8748956
    },
    {
        "day": 5,
        "name": "Philae Temple",
        "query": "Philae Temple Agilkia Island Aswan",
        "lat": 24.0258,
        "lng": 32.8842
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color), title: s.name, alt: s.name});
  marker.on('add', () => {
    const el = marker.getElement();
    if (el) el.setAttribute('aria-label', s.name + ', Day ' + s.day);
  });
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
