<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="Moscow — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Saint Basil's Cathedral",
        "query": "Saint Basil's Cathedral, Red Square, Moscow",
        "lat": 55.7524736,
        "lng": 37.6231624
    },
    {
        "day": 1,
        "name": "Red Square",
        "query": "Red Square, Moscow",
        "lat": 55.7535908,
        "lng": 37.6215013
    },
    {
        "day": 1,
        "name": "Moscow Kremlin",
        "query": "Kutafya Tower, Moscow Kremlin",
        "lat": 55.7516212,
        "lng": 37.618122
    },
    {
        "day": 1,
        "name": "Zaryadye Park",
        "query": "Zaryadye Park, Varvarka 6, Moscow",
        "lat": 55.7512173,
        "lng": 37.6289346
    },
    {
        "day": 2,
        "name": "Novodevichy Convent",
        "query": "Novodevichy Proezd 1, Moscow",
        "lat": 55.7262522,
        "lng": 37.5535045
    },
    {
        "day": 2,
        "name": "Sparrow Hills",
        "query": "Sparrow Hills viewing platform, Moscow",
        "lat": 55.7063332,
        "lng": 37.5404856
    },
    {
        "day": 2,
        "name": "Cathedral of Christ the Saviour",
        "query": "Volkhonka Street 15, Moscow",
        "lat": 55.7445243,
        "lng": 37.6055105
    },
    {
        "day": 2,
        "name": "Tretyakov Gallery",
        "query": "Lavrushinsky Lane 10, Moscow",
        "lat": 55.7413613,
        "lng": 37.6202196
    },
    {
        "day": 3,
        "name": "Komsomolskaya Station",
        "query": "Komsomolskaya Metro Station, Moscow",
        "lat": 55.7752083,
        "lng": 37.6560339
    },
    {
        "day": 3,
        "name": "VDNKh",
        "query": "Prospekt Mira 119, Moscow",
        "lat": 55.8290576,
        "lng": 37.6417328
    },
    {
        "day": 3,
        "name": "Museum of Cosmonautics",
        "query": "Prospekt Mira 111 building 1, Moscow",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Ostankino Tower",
        "query": "Akademika Koroleva Street 15 building 1, Moscow",
        "lat": 55.8197301,
        "lng": 37.6116554
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
