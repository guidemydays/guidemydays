<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>sintra — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="sintra — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Moorish Castle",
        "query": "Castelo dos Mouros 2710 Sintra Portugal",
        "lat": 38.7924119,
        "lng": -9.388669
    },
    {
        "day": 1,
        "name": "Pena Palace",
        "query": "Pena Palace Estrada da Pena 2710 Sintra Portugal",
        "lat": 38.7875681,
        "lng": -9.3905649
    },
    {
        "day": 1,
        "name": "Sintra National Palace",
        "query": "Palacio Nacional de Sintra Largo Rainha Dona Amelia 2710 Sintra Portugal",
        "lat": 38.7977723,
        "lng": -9.3908257
    },
    {
        "day": 1,
        "name": "Quinta da Regaleira",
        "query": "Quinta da Regaleira Rua Barbosa du Bocage 5 2710 Sintra Portugal",
        "lat": 38.7963463,
        "lng": -9.3960422
    },
    {
        "day": 2,
        "name": "Monserrate Palace",
        "query": "Palacio de Monserrate Estrada de Monserrate 2710 Sintra Portugal",
        "lat": 38.7942252,
        "lng": -9.4206484
    },
    {
        "day": 3,
        "name": "Cabo da Roca",
        "query": "Cabo da Roca Estrada do Cabo da Roca 2705 Colares Portugal",
        "lat": 38.7811071,
        "lng": -9.4972473
    },
    {
        "day": 2,
        "name": "Boca do Inferno",
        "query": "Boca do Inferno Avenida Rei Humberto II de Italia 2750 Cascais Portugal",
        "lat": 38.6911173,
        "lng": -9.430821
    },
    {
        "day": 2,
        "name": "Cascais",
        "query": "Largo Luis de Camoes 2750 Cascais Portugal",
        "lat": 38.6978039,
        "lng": -9.4204922
    },
    {
        "day": 3,
        "name": "Palácio de Seteais",
        "query": "Palácio de Seteais Sintra Portugal",
        "lat": 38.7967084,
        "lng": -9.3998683
    },
    {
        "day": 3,
        "name": "Convento dos Capuchos",
        "query": "Convento dos Capuchos Estrada N375 Sintra Portugal",
        "lat": 38.7831292,
        "lng": -9.4357803
    },
    {
        "day": 3,
        "name": "Azenhas do Mar",
        "query": "Azenhas do Mar Colares Sintra Portugal",
        "lat": 38.840956,
        "lng": -9.4619065
    },
    {
        "day": 4,
        "name": "Palácio de Queluz",
        "query": "Palácio Nacional de Queluz Largo do Palácio Queluz Portugal",
        "lat": 38.7505237,
        "lng": -9.2582458
    },
    {
        "day": 5,
        "name": "Belém Tower",
        "query": "Torre de Belem Lisbon Portugal",
        "lat": 38.691586,
        "lng": -9.2159288
    },
    {
        "day": 5,
        "name": "Jerónimos Monastery",
        "query": "Mosteiro dos Jeronimos Lisbon Portugal",
        "lat": 38.6977577,
        "lng": -9.2066239
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
