<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Yogyakarta — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>

<script src="/maps/vendor/leaflet.min.js"></script>

<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Fort Vredeburg Museum",
        "query": "Jalan Ahmad Yani No. 6, Gondomanan, Yogyakarta",
        "lat": -7.7998214,
        "lng": 110.366268
    },
    {
        "day": 1,
        "name": "Kraton Ngayogyakarta Hadiningrat",
        "query": "Jalan Rotowijayan Blok No.1, Panembahan, Kraton, Yogyakarta",
        "lat": -7.8075974,
        "lng": 110.3638696
    },
    {
        "day": 1,
        "name": "Taman Sari Water Castle",
        "query": "Jalan Nagan Lor No. 18, Patehan, Kraton, Yogyakarta",
        "lat": -7.8116595,
        "lng": 110.3588202
    },
    {
        "day": 1,
        "name": "Tugu Yogyakarta",
        "query": "Jalan Jenderal Sudirman, Gowongan, Jetis, Yogyakarta",
        "lat": -7.7829099,
        "lng": 110.3670713
    },
    {
        "day": 2,
        "name": "Borobudur",
        "query": "Borobudur Temple, Magelang, Central Java",
        "lat": -7.6079583,
        "lng": 110.2038245
    },
    {
        "day": 2,
        "name": "Pawon Temple",
        "query": "Candi Pawon, Borobudur, Magelang",
        "lat": -7.606128,
        "lng": 110.2195602
    },
    {
        "day": 2,
        "name": "Mendut Temple",
        "query": "Jalan Mayor Kusen No.92, Mendut, Mungkid, Magelang",
        "lat": -7.6005958,
        "lng": 110.2238673
    },
    {
        "day": 3,
        "name": "Prambanan",
        "query": "Jl Raya Jogja-Solo Km 16, Prambanan, Sleman",
        "lat": -7.7853884,
        "lng": 110.4960751
    },
    {
        "day": 3,
        "name": "Sewu Temple",
        "query": "Candi Sewu, Prambanan, Sleman",
        "lat": -7.7853884,
        "lng": 110.4960751
    },
    {
        "day": 3,
        "name": "Tebing Breksi",
        "query": "Tebing Breksi, Sambirejo, Prambanan, Sleman",
        "lat": -7.7814295,
        "lng": 110.5049834
    },
    {
        "day": 3,
        "name": "Ratu Boko",
        "query": "Situs Ratu Boko, Bokoharjo, Prambanan, Sleman",
        "lat": -7.7740948,
        "lng": 110.4975435
    },
    {
        "day": 4,
        "name": "Pindul Cave",
        "query": "Goa Pindul, Bejiharjo, Karangmojo, Gunungkidul",
        "lat": -7.9310483,
        "lng": 110.6479201
    },
    {
        "day": 4,
        "name": "Timang Beach",
        "query": "Pantai Timang, Purwodadi, Tepus, Gunungkidul",
        "lat": -8.1756475,
        "lng": 110.6632846
    },
    {
        "day": 5,
        "name": "Kraton Surakarta Hadiningrat",
        "query": "Jalan Sasono Mulyo, Baluwarti, Surakarta",
        "lat": -7.5805591,
        "lng": 110.8284245
    },
    {
        "day": 5,
        "name": "Fort Vastenburg",
        "query": "Jalan Jenderal Sudirman, Kedung Lumbu, Pasar Kliwon, Surakarta",
        "lat": -7.5813633,
        "lng": 110.8328742
    },
    {
        "day": 5,
        "name": "Pura Mangkunegaran",
        "query": "Jalan Ronggowarsito, Keprabon, Surakarta",
        "lat": -7.568193,
        "lng": 110.8231529
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
