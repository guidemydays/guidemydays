     below, where "or" would wrongly read as any single type working
     everywhere in the country. */
  function typeList(t){
    var a=t.split('');
    if(a.length===1) return 'Type '+a[0];
    return 'Type '+a.slice(0,-1).join(', ')+' or '+a[a.length-1];
  }

  /* Same letters joined with "and", for the instruction line: a country
     with several types in use needs all of them covered, not any one. */
  function typeAnd(t){
    var a=t.split('');
    if(a.length===1) return 'Type '+a[0];
    return 'Type '+a.slice(0,-1).join(', ')+' and '+a[a.length-1];
  }

  function show(anchor){
    var row=BYA[anchor];
    if(!row){ elRes.hidden=true; return; }
    document.getElementById('pg-country').textContent=row[1];
    document.getElementById('pg-volt').textContent=row[3].replace(' / ',' \u00b7 ')+'  \u00b7  '+row[2];
    document.getElementById('pg-answer').innerHTML=(row[4].length===1)
      ? 'Bring a <b>'+esc(typeList(row[4]))+'</b> adapter.'
      : 'Bring <b>'+esc(typeAnd(row[4]))+'</b> plugs.';
    var out=[], t=row[4].split(''), j;
    for(j=0;j<t.length;j++){
      var L=t[j], meta=PT[L]; if(!meta) continue;
      var slug=L.toLowerCase();
      out.push('<div class="pg-type">'
        +'<div class="pg-type-head">Type '+esc(L)+' \u2014 '+esc(meta.h)+'</div>'
        +'<div class="pg-type-desc">'+esc(meta.d)+'</div>'
        +'<div class="pg-imgs">'
        +'<div class="pg-img-box"><img src="/plugs/imgs/type-'+slug+'-wall-socket.jpg" width="180" height="180" alt="Type '+esc(L)+' wall socket" loading="lazy"><div class="pg-img-label">Wall Socket</div></div>'
        +'<div class="pg-img-box"><img src="/plugs/imgs/type-'+slug+'-plug.jpg" width="180" height="180" alt="Type '+esc(L)+' plug face" loading="lazy"><div class="pg-img-label">Plug</div></div>'
        +'</div></div>');
    }
    document.getElementById('pg-types').innerHTML=out.join('');
    elRes.hidden=false;
  }

  /* The search NAMES the country; it does not filter a list, because there is
     no list left to filter. Any typed edit — clearing the box, or typing past
     an already-picked name into something new — hides the result: it is only
     ever valid for the exact pick that produced it. A programmatic value-set
     from picking a match (search-autocomplete.js) never fires 'input', so
     this cannot race the show() that follows a pick. */
  input.addEventListener('input',function(){ elRes.hidden=true; });

  if(window.TVESearch){
    var items=[];
    for(i=0;i<PG.length;i++){
      var r=PG[i];
      /* sub carries the region AND the plug types, so the shared typeahead —
         which matches on name OR sub — answers "who uses Type G" and "Europe"
         from the same box. That is the one thing the retired table could do
         that a per-country lookup cannot, and it is why the sub is not just
         decoration. */
      items.push({name:r[1], sub:r[2]+' \u00b7 '+typeList(r[4])+' \u00b7 '+r[3].split(' / ')[0], anchor:r[0]});
    }
    /* Guide cities are the "or City" half of the placeholder: typing a shipped
       guide's city (e.g. "Tokyo") must resolve to its own country's plug entry,
       same country-guides.json source the visa page's guide-link chip already
       reads. A country with no shipped guide still searches by name only —
       that is the honest answer, not a gap to fill with invented cities. Fetch
       runs before attach() so search-autocomplete.js's one-time field build
       sees the city text, not an empty one it would never re-read. */
    fetch('/assets/country-guides.json').then(function(r){ return r.json(); }).then(function(map){
      /* A few keys in country-guides.json are shouted ("SOUTH AFRICA",
         "PHILIPPINES", "LATVIA", "MALTA" — a known case-split, see visa.html's
         own fold() workaround for the same file) while PG always uses normal
         case. Case-fold once here rather than trust every key matches r[1]. */
      var byUpper={};
      for(var k in map){ if(k!=='_by_slug') byUpper[k.toUpperCase()]=map[k]; }
      for(var j=0;j<items.length;j++){
        var cities=map[items[j].name]||byUpper[items[j].name.toUpperCase()];
        if(cities&&cities.length) items[j].text=cities.map(function(c){return c.city;}).join(' ');
      }
    }).catch(function(){}).then(function(){
      TVESearch.attach(input,{items:items,onPick:function(it){ show(it.anchor); }});
    });
  }

  /* The ONE thing that may arrive with a country already selected: a #Country
     link the reader clicked in a guide. */
  if(window.__tveDeep && BYA[window.__tveDeep]){
    input.value=BYA[window.__tveDeep][1];
    show(window.__tveDeep);
  }
}());
</script>
</body>
</html>
