<style>/* OWNER-DIRECTED 2026-08-12: the banner and intro card used to live INSIDE
   .wx-wrap, so they were squeezed into the 460px result column and looked
   nothing like the banner on every other page — the heading wrapped over two
   lines and the intro ran as a narrow ribbon. They now sit in the shared .wrap
   lane from web-travel-style.css (max-width:none, 32px gutters) — the very same
   element every other page uses, so this banner cannot drift from them — while
   .wx-wrap keeps its 460px for the weather panel itself.
   Banner full width, result centred. */
.wx-wrap { max-width: 460px; margin: 10px auto 0; padding: 0 14px; }
.wx-panel { background: var(--warm, #fdf8f0); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 6px 26px rgba(0,0,0,.10); padding: 22px 22px 26px; }
/* Colors/shape/hover/selected come from the shared .selection-pill-sm +
   .cp-rust classes (same family as the month pills below) -- only the
   two-up layout is page-local. */
.wx-unit { display: inline-flex; gap: 5px; flex-shrink: 0; }
/* Scoped to this page only — .sa-row is the shared TVESearch dropdown row used
   on 70+ pages, so its own base rule (padding:9px 14px, font-size:14px,
   font-weight:600) stays untouched globally. Brain/Reference/Icons-Formats-Logos/
   from-Reference-and-CoreRules/TVESearch.html is the canonical spec: dropdown
   rows are NOT icon-aligned to the input above
   them — they get their own flat 12px 16px padding and 13px font, independent
   of the input's 36px icon inset. Weight only is dropped to regular to match
   the de-bolded input text per owner request. */
#wx-panel .sa-row { padding: 12px 16px; font-size: 13px; font-weight: 400; }
#wx-panel[hidden] { display: none !important; }
.wx-panel-head { display: flex; align-items: center; justify-content: space-between; }
.wx-month { font-size: 13px; font-weight: 700; color: var(--sp-ink); }
.wx-bignums { display: flex; justify-content: center; gap: 28px; margin-top: 10px; }
.wx-bignums .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.wx-bignums .val { font-size: 34px; font-weight: 700; line-height: 1.1; }
.wx-hi .lbl, .wx-hi .val { color: var(--c-temp-hi); }
.wx-lo .lbl, .wx-lo .val { color: var(--c-temp-lo); }
.wx-divider { width: 1px; background: var(--border); }
.wx-chart { margin-top: 22px; display: flex; align-items: flex-end; gap: 2px; }
.wx-col { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; }
.wx-coltrack { position: relative; width: 100%; display: flex; justify-content: center; }
.wx-bar { position: absolute; width: 7px; border-radius: 4px; background: color-mix(in srgb, var(--rust) 30%, transparent); }
.wx-bar.on { background: var(--rust, #C04E1A); }
.wx-collab { font-size: 9px; margin-top: 4px; color: var(--sp-ink); }
.wx-collab.on { font-weight: 700; }
.wx-hint { margin-top: 16px; font-size: 12px; text-align: center; color: var(--muted); }
.wx-mongrid { margin-top: 22px; display: grid; grid-template-columns: repeat(6,1fr); gap: 7px; }
/* Everything -- color, shape, size -- comes from the shared
   .selection-pill-sm + .cp-rust classes (same size as the °C/°F toggle
   above); .selection-pill itself reads oversized packed 6-up in this
   grid. No page-local rule needed. */
.wx-rain { display: flex; justify-content: center; gap: 22px; margin-top: 14px;
  padding: 10px 0 0; border-top: 1px solid var(--border2); }
.wx-rain .rlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--c-rain); }
.wx-rain .rval { font-size: 22px; font-weight: 700; color: var(--c-rain); line-height: 1.1; }
.wx-note { color: var(--muted); font-size: 11px; margin-top: 14px; text-align: center; }
/* Hero is the shared .hero-band.eb-hero component (web-travel-style.css) —
   same beige gradient, kicker pill and .eb-graphic icon slot as currencies,
   packing, lounges and local-prices. The search field sits in the shared
   .hero-ground band below it, same as those pages. */
/* #wx-search-wrap (Cleanliness rule 865 / brain_check.check_weather_page_opens_empty)
   gives the suggestion dropdown a positioning context inside .hero-ground and
   pins its gap to the guides-index 14px offset; .hero-ground .search-input
   still owns the input's own width/centering. */
.wx-search .sa-suggest { top: calc(100% + 14px); }
@media (prefers-color-scheme: dark) {
  /* --c-temp-hi #e05030 is 4.05:1 on #242220 (warm bg) — not AA; lighten to #f07050 (5.0:1) */
  :root { --c-temp-hi: #f07050; }
}

<div class="wrap">
  <div class="hero-band eb-hero">
    <span class="eb-kicker">Weather by city</span>
    <div class="eb-copy">
      <h1 class="eb-title" id="wx-hero-h">Every destination, <em>month by month.</em></h1>
      <p class="eb-intro" id="wx-hero-sub">Typical highs, lows and rainfall for every destination, month by month — the shape of a whole year, not a single number pulled from today's forecast. Search any city or country to see <strong>when it's driest, when it's warmest, and when to actually go</strong>.</p>
    </div>
    <div class="eb-graphic" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="9.6" cy="9" r="4.6" fill="url(#gm-sun)" stroke="var(--c-sun-rim)" stroke-width="0.5"/><circle cx="9.6" cy="9" r="4.6" fill="url(#gm-gloss)"/>
      <g stroke="var(--c-amber)" stroke-width="1.8" stroke-linecap="round">
        <path d="M9.6 1.6v1.8"/><path d="M1.6 9h1.8"/><path d="M3.9 3.3 5.2 4.6"/>
        <path d="M15.3 3.3 14 4.6"/><path d="M3.9 14.7 5.2 13.4"/>
      </g>
      <path d="M9 21.4a3.9 3.9 0 0 1 .4-7.8 5.2 5.2 0 0 1 9.7 1.3 3.2 3.2 0 0 1-.5 6.5z" fill="url(#gm-sky)" stroke="var(--c-sky-rim)" stroke-width="0.5"/>
      <path d="M9.4 13.6a5.2 5.2 0 0 1 6 1.4 3.6 3.6 0 0 0-5.1 1.9 3.9 3.9 0 0 0-1.3-3.3z" fill="url(#gm-paper)" stroke="var(--c-rim-cool)" stroke-width="0.6" opacity="0.65"/>
    </svg></div>
  </div>

  <div class="hero-ground">
    <div id="wx-search-wrap" class="wx-search" style="position:relative">
      <input type="search" class="search-input" id="wx-city-search" placeholder="City or country" aria-label="Search for a city" autocomplete="off">
    </div>
  </div>

  <div class="wx-wrap">
    <div class="wx-panel cp-rust" id="wx-panel" hidden></div>
  </div>
</div>

<script>
(function () {
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July',
                     'August','September','October','November','December'];
  var panel = document.getElementById('wx-panel');
  var DB = {}, cityKeys = [];
  var curKey = null, selMonth = new Date().getMonth();

  function unit() { try { return localStorage.getItem('guideTempUnit') === 'F' ? 'F' : 'C'; } catch (e) { return 'C'; } }
  function setUnit(u) { try { localStorage.setItem('guideTempUnit', u); } catch (e) {} }
  function conv(c) { return unit() === 'F' ? Math.round(c * 9 / 5 + 32) : Math.round(c); }

  /* The search input lives in the hero above the panel and is wired ONCE, not
     rebuilt on every render — a re-created input loses focus mid-typing and
     drops the TVESearch binding. The °C/°F toggle lives inside the panel
     itself (rebuilt with it each render, same as the month pills). */
  function paintHero() {
    var h = document.getElementById('wx-hero-h');
    var sub = document.getElementById('wx-hero-sub');
    var cityName = DB[curKey] ? (DB[curKey].city || curKey) : '';
    if (!h || !sub) return;
    if (cityName) {
      h.innerHTML = cityName + ', <em>month by month.</em>';
      sub.textContent = 'Typical highs, lows and rainfall in ' + cityName +
        ' through the year — long-run averages, not a forecast.';
    } else {
      h.innerHTML = 'Every destination, <em>month by month.</em>';
      sub.innerHTML = 'Typical highs, lows and rainfall for every destination, month by month — the shape of a whole year, not a single number pulled from today\'s forecast. Search any city or country to see <strong>when it\'s driest, when it\'s warmest, and when to actually go</strong>.';
    }
  }

  function paintUnit() {
    var u = unit();
    document.querySelectorAll('#wx-unit button').forEach(function (b) {
      var sel = b.dataset.u === u;
      b.classList.toggle('is-on', sel);
      b.setAttribute('aria-pressed', String(sel));
    });
  }

  function body() {
    var rec = DB[curKey];
    var hi = conv(rec.hi[selMonth]) + '°' + unit();
    var lo = conv(rec.lo[selMonth]) + '°' + unit();

    var vals = [];
    for (var i = 0; i < 12; i++) { vals.push(rec.hi[i]); vals.push(rec.lo[i]); }
    var lo0 = Math.min.apply(null, vals), hi0 = Math.max.apply(null, vals);
    var span = (hi0 - lo0) || 1, H = 86, bars = '';
    for (var j = 0; j < 12; j++) {
      var on = (j === selMonth);
      var top = (1 - (rec.hi[j] - lo0) / span) * H;
      var bot = (1 - (rec.lo[j] - lo0) / span) * H;
      var barH = Math.max(3, bot - top);
      bars += '<div class="wx-col" data-mon="' + j + '">' +
          '<div class="wx-coltrack" style="height:' + H + 'px;">' +
            '<div class="wx-bar' + (on ? ' on' : '') + '" style="top:' + top + 'px;height:' + barH + 'px;"></div>' +
          '</div>' +
          '<div class="wx-collab' + (on ? ' on' : '') + '">' + MONTHS[j][0] + '</div>' +
        '</div>';
    }

    var grid = MONTHS.map(function (mo, k) {
      return '<button class="wx-mon selection-pill-sm cp-rust hov-darken' + (k === selMonth ? ' is-on' : '') + '" data-mon="' + k + '" aria-pressed="' + (k === selMonth ? 'true' : 'false') + '">' + mo + '</button>';
    }).join('');

    var rainRow = '';
    if (rec.rain && rec.rd) {
      var mm = rec.rain[selMonth] || 0;
      var rd = rec.rd[selMonth] || 0;
      rainRow = '<div class="wx-rain">' +
        '<div style="text-align:center;"><div class="rlbl">Rain</div><div class="rval">' + mm + '<span style="font-size:13px;font-weight:400;"> mm</span></div></div>' +
        '<div class="wx-divider"></div>' +
        '<div style="text-align:center;"><div class="rlbl">Rainy days</div><div class="rval">' + rd + '</div></div>' +
      '</div>';
    }

    return '<div class="wx-panel-head">' +
        '<div class="wx-month">' + MONTHS_LONG[selMonth] + '</div>' +
        '<div class="wx-unit" id="wx-unit">' +
          '<button class="selection-pill-sm cp-rust hov-darken" data-u="C" aria-label="Celsius" aria-pressed="false">°C</button>' +
          '<button class="selection-pill-sm cp-rust hov-darken" data-u="F" aria-label="Fahrenheit" aria-pressed="false">°F</button>' +
        '</div>' +
      '</div>' +
      '<div class="wx-bignums">' +
        '<div class="wx-hi" style="text-align:center;"><div class="lbl">High</div><div class="val">' + hi + '</div></div>' +
        '<div class="wx-divider"></div>' +
        '<div class="wx-lo" style="text-align:center;"><div class="lbl">Low</div><div class="val">' + lo + '</div></div>' +
      '</div>' + rainRow +
      '<div class="wx-chart">' + bars + '</div>' +
      '<div class="wx-hint">Tap a month · avg daily high/low</div>' +
      '<div class="wx-mongrid">' + grid + '</div>';
  }

  function render() {
    /* No city -> the card does not exist. It is NOT rendered empty: .wx-panel is
       a raised card (cream fill, border, 26px shadow) sized by its content, so an
       empty one is a blank banner floating under the search. */
    if (!DB[curKey]) {
      panel.innerHTML = '';
      panel.hidden = true;
      paintHero();
      paintUnit();
      return;
    }
    panel.hidden = false;
    panel.innerHTML = body();
    paintHero();
    paintUnit();
    panel.querySelectorAll('.wx-col').forEach(function (c) {
      c.addEventListener('click', function () { selMonth = +c.dataset.mon; render(); });
    });
    panel.querySelectorAll('.wx-mon').forEach(function (b) {
      b.addEventListener('click', function () { selMonth = +b.dataset.mon; render(); });
    });
    panel.querySelectorAll('#wx-unit button').forEach(function (b) {
      b.addEventListener('click', function () { setUnit(b.dataset.u); render(); });
    });
  }

  var data = window.TravelClimate || {};
  Object.keys(data).forEach(function (k) {
    if (k === '_meta' || k === '_generated' || !data[k] || !data[k].hi) return;
    DB[k] = data[k];
  });

    cityKeys = Object.keys(DB).sort(function (a, b) { return (DB[a].city || a).localeCompare(DB[b].city || b); });
  /* `sub` is the country, and it is not decoration: TVESearch matches on name OR
     sub, so this is what makes typing "Japan" list Tokyo, Kyoto and Osaka the way
     it does in every other search on the site. Without it this page was the one
     city-only search left — a country query returned nothing. The country rides
     in the baked climate data as `co` (build_climate.py). */
  var tveItems = cityKeys.map(function (k) {
    return { name: DB[k].city || k, sub: DB[k].co || '', key: k };
  });
  if (cityKeys.length) {
        var hashKey = decodeURIComponent(location.hash.slice(1));
    /* Case-insensitive match so guide deep-links like #nairobi resolve to "Nairobi". */
    var hashLower = hashKey.toLowerCase();
    curKey = hashKey ? (cityKeys.filter(function(k){ return k.toLowerCase() === hashLower; })[0] || null) : null;
    var inp0 = document.getElementById('wx-city-search');
    if (inp0) inp0.value = DB[curKey] ? (DB[curKey].city || curKey) : '';
    if (window.TVESearch && inp0) {
      TVESearch.attach(inp0, { items: tveItems, onPick: function (it) { curKey = it.key; render(); } });
    }
    render();
  } else {
    panel.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);">Could not load climate data.</div>';
  }
})();
</script>
